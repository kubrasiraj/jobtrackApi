[project]
name = "jobtrack-api"
version = "0.1.0"
description = ""
authors = [
    {name = "Kubra Siraj",email = "kubrasiraj267@gmail.com"}
]
requires-python = ">=3.11"
dependencies = [
    "fastapi (>=0.142.1,<0.143.0)",
    "uvicorn[standard] (>=0.54.0,<0.55.0)",
    "alembic (>=1.20.0,<2.0.0)",
    "pydantic[email] (>=2.13.5,<3.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "psycopg (>=3.3.6,<4.0.0)",
    "python-jose[cryptography] (>=3.5.0,<4.0.0)",
    "passlib[bcrypt] (>=1.7.4,<2.0.0)",
    "bcrypt (==4.0.1)",
    "python-multipart (>=0.0.32,<0.0.33)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]